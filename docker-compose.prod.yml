# Proyecto independiente: no reinicia ni elimina servicios del backend.
name: analizador-frontend

services:
  frontend:
    image: ${FRONTEND_IMAGE:?definir FRONTEND_IMAGE}:${FRONTEND_TAG:?definir FRONTEND_TAG}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128m
    # Caddy llega por la red Docker; no se publica otro puerto en la EC2.
    networks:
      backend:
        aliases: [frontend]

networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK:-analizador_interna}
