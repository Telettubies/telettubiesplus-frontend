# Integracion continua del frontend antes de fusionar en main.
# Instala dependencias y comprueba el build; no necesita secretos ni accede a la VM.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build del frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Configuracion ficticia de build; el CD usa la configuracion publica real.
      VITE_API_BASE_URL: http://localhost:8000/api
      VITE_SUPABASE_URL: https://ci.supabase.co
      VITE_SUPABASE_ANON_KEY: public-anon-key-placeholder
      VITE_USE_MOCKS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias del lockfile
        run: npm ci --include=dev

      - name: Construir frontend
        run: npm run build
