# Imagen de produccion en GHCR; entorno publico desde el .env.production de la VM.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: despliegue-frontend-produccion
  cancel-in-progress: false

jobs:
  imagen:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
    steps:
      - uses: actions/checkout@v6
      - name: Nombre de imagen
        id: nombre
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        if: ${{ vars.PLATAFORMA == 'linux/arm64' }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ vars.PLATAFORMA || 'linux/amd64' }}
          push: true
          build-args: REVISION=${{ github.sha }}
          tags: |
            ${{ steps.nombre.outputs.imagen }}:${{ github.sha }}
            ${{ steps.nombre.outputs.imagen }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  despliegue:
    name: Desplegar frontend en EC2
    needs: imagen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: produccion
    permissions:
      contents: read
      packages: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USUARIO: ${{ secrets.EC2_USUARIO }}
      DIRECTORIO: ${{ vars.EC2_DIRECTORIO || 'analizador-frontend' }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://criterio.duckdns.org' }}
    steps:
      - uses: actions/checkout@v6
      - name: Configurar SSH con identidad del servidor verificada
        env:
          EC2_LLAVE_SSH: ${{ secrets.EC2_LLAVE_SSH }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for nombre in EC2_HOST EC2_USUARIO EC2_LLAVE_SSH EC2_KNOWN_HOSTS FRONTEND_URL; do
            [[ -n "${!nombre}" ]] || { echo "::error::Falta configurar $nombre (README.md)"; exit 1; }
          done
          [[ "$EC2_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 1
          [[ "$EC2_USUARIO" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 1
          [[ "$DIRECTORIO" =~ ^[a-zA-Z0-9_/-]+$ && "$DIRECTORIO" != -* ]] || exit 1
          [[ "$FRONTEND_URL" == https://* ]] || exit 1
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_LLAVE_SSH" > ~/.ssh/ec2
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ec2 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host ec2
            HostName $EC2_HOST
            User $EC2_USUARIO
            IdentityFile ~/.ssh/ec2
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Copiar Compose sin sobrescribir el entorno
        run: |
          set -euo pipefail
          ssh ec2 "bash -s -- $(printf '%q ' "$DIRECTORIO")" <<'EOF'
          set -euo pipefail
          directorio=$(realpath -m -- "$1")
          [[ "$directorio" != / && "$directorio" != "$HOME" ]] || exit 1
          if [[ -f "$directorio/docker-compose.prod.yml" ]] && grep -q BACKEND_IMAGE "$directorio/docker-compose.prod.yml"; then
            echo 'EC2_DIRECTORIO apunta al backend; elegir una carpeta separada.' >&2
            exit 1
          fi
          mkdir -p -- "$directorio"
          EOF
          scp docker-compose.prod.yml .env.prod.example "ec2:$DIRECTORIO/"
      - name: Descargar, recrear y verificar version
        env:
          IMAGEN: ${{ needs.imagen.outputs.imagen }}
          TAG: ${{ github.sha }}
          GHCR_USUARIO: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh ec2 "docker login ghcr.io -u '$GHCR_USUARIO' --password-stdin"
          ssh ec2 "bash -s -- $(printf '%q ' "$DIRECTORIO" "$IMAGEN" "$TAG" "$FRONTEND_URL")" <<'EOF'
          set -euo pipefail
          cd "$1"
          trap 'docker logout ghcr.io >/dev/null' EXIT
          test -f .env.production || { echo 'Falta .env.production del frontend en la VM.' >&2; exit 1; }
          export FRONTEND_IMAGE="$2" FRONTEND_TAG="$3"
          COMPOSE='docker compose --env-file .env.production -f docker-compose.prod.yml'
          anterior=$($COMPOSE ps -q frontend | xargs -r docker inspect --format '{{.Config.Image}}')
          $COMPOSE pull frontend
          if $COMPOSE up -d --no-build --wait --wait-timeout 120; then
            for _ in $(seq 1 12); do
              if [[ "$(curl --fail --silent --show-error --max-time 15 --proto '=https' "${4%/}/version.txt")" == "$3" ]]; then
                echo "Desplegado $2:$3"
                exit 0
              fi
              sleep 5
            done
          fi
          $COMPOSE logs --tail=100 frontend
          if [[ -n "$anterior" ]]; then
            export FRONTEND_IMAGE="${anterior%:*}" FRONTEND_TAG="${anterior##*:}"
            $COMPOSE up -d --no-build --wait --wait-timeout 120
            echo 'Restaurada la imagen anterior; se conserva el .env.production actual.'
          fi
          echo '::error::Fallo del despliegue o de HTTPS; revisar Caddy, red y .env.'
          exit 1
          EOF

      - name: Limpiar llave SSH
        if: always()
        run: rm -f ~/.ssh/ec2
